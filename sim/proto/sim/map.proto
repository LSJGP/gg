syntax = "proto3";

package hyw_sim.proto;

import "proto/sim/common.proto";

message BoundarySegment {
  int32 lane_start_index = 1;
  int32 lane_end_index = 2;
  int64 boundary_feature_id = 3;
  string boundary_type = 4;
}

message LaneNeighbor {
  int64 feature_id = 1;
  int32 self_start_index = 2;
  int32 self_end_index = 3;
  int32 neighbor_start_index = 4;
  int32 neighbor_end_index = 5;
  repeated BoundarySegment boundaries = 6;
}

message Lane {
  int64 id = 1;
  string type = 2;
  double speed_limit_kmh = 3;
  bool interpolating = 4;
  repeated Vec3 centerline = 5;
  repeated int64 entry_lanes = 6;
  repeated int64 exit_lanes = 7;
  repeated BoundarySegment left_boundaries = 8;
  repeated BoundarySegment right_boundaries = 9;
  repeated LaneNeighbor left_neighbors = 10;
  repeated LaneNeighbor right_neighbors = 11;
}

message RoadLine {
  int64 id = 1;
  string type = 2;
  repeated Vec3 polyline = 3;
}

message RoadEdge {
  int64 id = 1;
  string type = 2;
  repeated Vec3 polyline = 3;
}

message Crosswalk {
  int64 id = 1;
  repeated Vec3 polygon = 2;
}

message StopSign {
  int64 id = 1;
  Vec3 position = 2;
  repeated int64 lanes = 3;
}

message Driveway {
  int64 id = 1;
  repeated Vec3 polygon = 2;
}

message SpeedBump {
  int64 id = 1;
  repeated Vec3 polygon = 2;
}

message MapFeatureCounts {
  int32 lanes = 1;
  int32 road_lines = 2;
  int32 road_edges = 3;
  int32 crosswalks = 4;
  int32 stop_signs = 5;
  int32 driveways = 6;
  int32 speed_bumps = 7;
}

message StaticMap {
  string source = 1;
  string scenario_id = 2;
  WorldOffset world_offset = 3;
  MapFeatureCounts map_feature_counts = 4;
  repeated Lane lanes = 5;
  repeated RoadLine road_lines = 6;
  repeated RoadEdge road_edges = 7;
  repeated Crosswalk crosswalks = 8;
  repeated StopSign stop_signs = 9;
  repeated Driveway driveways = 10;
  repeated SpeedBump speed_bumps = 11;
}
