syntax = "proto3";

package grading_mini.proto;

import "google/protobuf/any.proto";

message MetricFrameOutput {
  int64 frame_id = 1;

  oneof value_one_of {
    bool bool_value = 10;
    double double_value = 11;
  }

  google.protobuf.Any custom_info = 20;
}

message MetricSummary {
  string metric_name = 1;
  bool passed = 2;
  string detail = 3;
}

message GradingReport {
  bool overall_passed = 1;
  repeated MetricSummary summaries = 2;
}
